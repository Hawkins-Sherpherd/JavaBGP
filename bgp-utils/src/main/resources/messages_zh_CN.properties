# CLI Help
cli.usage=用法: java -jar bgp-utils-cli.jar [选项]
cli.options=选项:
cli.opt.I=  -I              交互模式
cli.opt.i=  -i <文件>       输入文件路径
cli.opt.o=  -o <文件>       输出文件路径
cli.opt.r=  -r <正则>       AS_PATH 正则表达式（可多次使用）
cli.opt.c=  -c <类型>       转换类型: mrt2csv, csv2csv, csv2txt, txt2iproute2
cli.opt.n=  -n <地址>       下一跳地址（仅用于 txt2iproute2）
cli.opt.v=  -v              启用调试输出
cli.opt.h=  -h              显示此帮助信息
cli.examples=示例:
cli.ex1=  java -jar bgp-utils-cli.jar -I
cli.ex2=  java -jar bgp-utils-cli.jar -c mrt2csv -i input.mrt -o output.csv
cli.ex3=  java -jar bgp-utils-cli.jar -c csv2csv -i input.csv -o output.csv -r "9808$" -r "^424242"
cli.ex4=  java -jar bgp-utils-cli.jar -c txt2iproute2 -i routes.txt -o script.sh -n 192.168.1.1

# CLI Errors
cli.error.missing.args=缺少必要参数。使用 -h 查看帮助。
cli.error.missing.input=缺少输入文件。使用 -i <文件>
cli.error.missing.output=缺少输出文件。使用 -o <文件>
cli.error.missing.convert=缺少转换类型。使用 -c <类型>
cli.error.missing.nexthop=缺少下一跳地址。使用 -n <地址>
cli.error.invalid.convert=无效的转换类型: {0}。有效类型: mrt2csv, csv2csv, csv2txt, txt2iproute2
cli.error.duplicate.arg=重复的参数: {0}
cli.error.unknown.arg=未知的参数: {0}