# CLI Help
cli.usage=Usage: java -jar bgp-utils-cli.jar [options]
cli.options=Options:
cli.opt.I=  -I              Interactive mode
cli.opt.i=  -i <file>       Input file path
cli.opt.o=  -o <file>       Output file path
cli.opt.r=  -r <regex>      AS_PATH regular expression (can be used multiple times)
cli.opt.c=  -c <type>       Conversion type: mrt2csv, csv2csv, csv2txt, txt2iproute2
cli.opt.n=  -n <address>    Next hop address (only for txt2iproute2)
cli.opt.v=  -v              Enable debug output
cli.opt.h=  -h              Show this help message
cli.examples=Examples:
cli.ex1=  java -jar bgp-utils-cli.jar -I
cli.ex2=  java -jar bgp-utils-cli.jar -c mrt2csv -i input.mrt -o output.csv
cli.ex3=  java -jar bgp-utils-cli.jar -c csv2csv -i input.csv -o output.csv -r "9808$" -r "^424242"
cli.ex4=  java -jar bgp-utils-cli.jar -c txt2iproute2 -i routes.txt -o script.sh -n 192.168.1.1

